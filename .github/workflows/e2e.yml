name: Observatory E2E

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://npm.pkg.github.com
          scope: '@arsybelovedlabs'
      - name: Enable Corepack
        run: corepack enable
      - name: Audit frozen visual contract
        run: node qa/visual-contract-audit.mjs
      - name: Resolve canonical package and refresh lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.MOONWITNESS_PACKAGES_TOKEN || github.token }}
        run: pnpm install --no-frozen-lockfile
      - name: Show registry lockfile delta
        run: git diff -- pnpm-lock.yaml
      - name: Verify production build
        run: pnpm build
      - name: Upload resolved lockfile evidence
        uses: actions/upload-artifact@v4
        with:
          name: registry-lockfile
          path: pnpm-lock.yaml
          if-no-files-found: error
      - name: Install Playwright for CI only
        run: npm install --no-save @playwright/test@latest
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run smoke tests
        run: npx playwright test
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
