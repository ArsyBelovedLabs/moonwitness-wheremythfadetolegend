name: Apply Registry Lock

on:
  push:
    branches: [dev]
    paths:
      - scripts/apply-registry-lock-0.3.2.mjs
      - .github/workflows/apply-registry-lock.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout dev
        uses: actions/checkout@v5
        with:
          ref: dev
      - name: Apply owner-resolved lockfile
        run: node scripts/apply-registry-lock-0.3.2.mjs
      - name: Verify exact package resolution
        run: |
          grep -n -A4 -B2 "moonwitness-frontend-platform" pnpm-lock.yaml | head -40
          test "$(sha256sum pnpm-lock.yaml | awk '{print $1}')" = "b4bc5325ce09aa6c249608afa3396237fe07dfd019c138943a91a402b3ba55e7"
      - name: Commit exact lockfile
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          git diff --cached --quiet && exit 0
          git commit -m "lock(web): pin canonical frontend package 0.3.2"
          git push origin HEAD:dev
