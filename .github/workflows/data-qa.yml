name: Observatory Data QA

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Validate JSON datasets
        run: node qa/validate.mjs
      - name: Validate P2 dataset integrity
        run: node qa/validate-p2.mjs
