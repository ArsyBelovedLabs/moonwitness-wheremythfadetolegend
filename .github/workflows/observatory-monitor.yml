name: Observatory 6-Hour Monitor

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: observatory-monitor
  cancel-in-progress: true

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Run public-source monitor
        run: node scripts/monitor.mjs

      - name: Build intelligence signals
        run: node scripts/intelligence.mjs

      - name: Commit monitoring and intelligence snapshot
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/monitor
          if git diff --cached --quiet; then
            echo 'No monitoring changes.'
            exit 0
          fi
          git commit -m "chore(monitor): refresh six-hour signal intelligence"
          git push
