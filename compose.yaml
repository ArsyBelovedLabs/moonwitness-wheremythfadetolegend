services:
  myth-fade:
    build:
      context: .
      dockerfile: Dockerfile
    image: moonwitness/wheremythfadetolegend:local
    init: true
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 8080
    # Coolify's reverse proxy reaches the container through the service
    # network. Do not publish a host port here: another Coolify resource may
    # already own 8080 on the node.
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/api/health"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    security_opt:
      - no-new-privileges:true
